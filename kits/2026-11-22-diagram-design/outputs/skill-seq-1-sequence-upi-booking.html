<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paying for a salon booking with UPI · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1360px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .note {
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--color-muted);
      margin-top: 1rem;
      max-width: 62ch;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Paying for a salon booking with UPI</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-upi-booking-title sequence-upi-booking-desc">
        <title id="sequence-upi-booking-title">Paying for a salon booking with UPI</title>
        <desc id="sequence-upi-booking-desc">A customer pays for a salon booking through UPI: the backend creates a Razorpay order, the customer approves in their UPI app, and a payment webhook confirms the booking once while a second delivery of the same event is acknowledged without effect.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- =================================================================
             LIFELINES — Page 112 · UPI app 376 · Razorpay 640 · Backend 904 · DB 1168
             ================================================================= -->
        <line x1="112" y1="128" x2="112" y2="772" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="376" y1="128" x2="376" y2="772" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="640" y1="128" x2="640" y2="772" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="904" y1="128" x2="904" y2="772" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1168" y1="128" x2="1168" y2="772" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================================================================
             ALT FRAGMENT — Razorpay · Backend · DB   (x=616 y=376 w=576 h=388)
             ================================================================= -->
        <rect x="616" y="376" width="576" height="388" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="616" y="376" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="636" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="628" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[delivery 1 · event_id new]</text>
        <line x1="624" y1="556" x2="1184" y2="556" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="628" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[delivery 2 · same event_id]</text>

        <!-- =================================================================
             ACTIVATION BARS
             ================================================================= -->
        <!-- Booking page: waits on the backend, then launches UPI -->
        <rect x="108" y="168" width="8" height="136" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- UPI app: customer approves -->
        <rect x="372" y="288" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Razorpay: order, approval, delivery 1, delivery 2 -->
        <rect x="636" y="204" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="636" y="320" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="636" y="436" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="636" y="604" width="8" height="140" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Backend: booking request, delivery 1, delivery 2 -->
        <rect x="900" y="168" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="900" y="436" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="900" y="604" width="8" height="140" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- DB: confirm write, duplicate rejection -->
        <rect x="1164" y="472" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1164" y="644" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- =================================================================
             MESSAGES — arrows first, then label masks
             ================================================================= -->
        <!-- M1 Page → Backend -->
        <line x1="116" y1="176" x2="900" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M2 Backend → Razorpay -->
        <line x1="900" y1="216" x2="644" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M3 Backend → Page (return) -->
        <line x1="900" y1="256" x2="116" y2="256" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M4 Page → UPI app -->
        <line x1="116" y1="296" x2="372" y2="296" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M5 UPI app → Razorpay -->
        <line x1="380" y1="336" x2="636" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Delivery 1 -->
        <!-- M6 Razorpay → Backend (webhook) -->
        <line x1="644" y1="444" x2="900" y2="444" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M7 Backend → DB (headline: booking confirmed) -->
        <line x1="908" y1="484" x2="1164" y2="484" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- M8 Backend → Razorpay (200 return) -->
        <line x1="900" y1="524" x2="644" y2="524" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Delivery 2 -->
        <!-- M9 Razorpay → Backend (webhook again) -->
        <line x1="644" y1="612" x2="900" y2="612" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M10 Backend → DB (insert event) -->
        <line x1="908" y1="652" x2="1164" y2="652" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M11 DB → Backend (return: unique violation) -->
        <line x1="1164" y1="692" x2="908" y2="692" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M12 Backend → Razorpay (200 return, no-op) -->
        <line x1="900" y1="732" x2="644" y2="732" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Labels: mask sits 8px above its stroke -->
        <rect x="464" y="156" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="508" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /BOOKINGS</text>

        <rect x="732" y="196" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="205" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREATE ORDER</text>

        <rect x="480" y="236" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="508" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORDER_ID</text>

        <rect x="208" y="276" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="244" y="285" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPI INTENT</text>

        <rect x="468" y="316" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="508" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIN APPROVED</text>

        <rect x="728" y="424" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="433" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEBHOOK EVT_01</text>

        <rect x="992" y="464" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1036" y="473" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSERT+CONFIRM</text>

        <rect x="748" y="504" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="513" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 OK</text>

        <rect x="728" y="592" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="601" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEBHOOK EVT_01</text>

        <rect x="994" y="632" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1036" y="641" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSERT EVT_01</text>

        <rect x="994" y="672" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1036" y="681" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DUPLICATE KEY</text>

        <rect x="734" y="712" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · NO-OP</text>

        <!-- =================================================================
             ACTOR BOXES — drawn after arrows
             ================================================================= -->
        <!-- Booking page (input) -->
        <rect x="40" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="87" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="112" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking page</text>
        <text x="112" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checkout in browser</text>

        <!-- UPI app (input) -->
        <rect x="304" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="312" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="326" y="87" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="376" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UPI app</text>
        <text x="376" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">customer's phone</text>

        <!-- Razorpay (external) -->
        <rect x="568" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="576" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
        <text x="590" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="640" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Razorpay</text>
        <text x="640" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payment gateway</text>

        <!-- Our backend (focal) -->
        <rect x="832" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="832" y="72" width="144" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="840" y="78" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="856" y="87" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="904" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Our backend</text>
        <text x="904" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orders · webhook</text>

        <!-- Booking DB (store) -->
        <rect x="1096" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1096" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="1104" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="1118" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="1168" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking DB</text>
        <text x="1168" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unique event_id</text>

        <!-- =================================================================
             LEGEND
             ================================================================= -->
        <line x1="40" y1="788" x2="1240" y2="788" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="804" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="819" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="828" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

        <rect x="190" y="815" width="28" height="18" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="198" y="827" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">ALT</text>
        <text x="226" y="828" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fragment: two outcomes</text>

        <line x1="400" y1="824" x2="428" y2="824" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="436" y="828" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP call</text>

        <line x1="530" y1="824" x2="558" y2="824" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="566" y="828" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Other call</text>

        <line x1="660" y1="824" x2="688" y2="824" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="696" y="828" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="770" y1="824" x2="798" y2="824" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="806" y="828" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Booking confirmed</text>
      </svg>
    </div>

    <p class="note">Razorpay delivers webhooks at least once, so the same event can arrive twice. The backend writes the event id under a unique key. The second delivery hits the key, changes nothing, and still gets a 200 so Razorpay stops retrying.</p>
  </div>
</body>
</html>
